# npm への publish は Trusted Publishing（OIDC）で行う。
# npmjs.com 側の Trusted Publisher 登録はこのファイル名（release.yml）と environment（npm）の完全一致が必要なので、
# ファイル名を変えないこと（登録時には検証されず、publish 時に初めて失敗する）。
name: release

on:
  push:
    # `v1` のような major タグ（このワークフロー自身が付け替える）では発火させない
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# ジョブ単位で必要な権限だけを付与する
permissions: {}

# リリースは 1 本ずつ実行する。並列に走ると、dist-tag の判定（npm view の latest）や
# major タグの付け替えの順序が崩れ、latest や v<major> が古い版に戻りうるため。
# GitHub は 1 グループにつき待機中の run を 1 本しか持たないので、3 本目を push すると待機中の 2 本目はキャンセルされる
# （publish 前に止まるだけなので安全。キャンセルされた run は後から再実行する）。
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # test だけ Node 18.18.2 で実行する。v1 の devDependency react-native@0.69.3 の jest/setup.js が
  # global.performance に代入するため、performance が read-only になった Node 18.19.0 以降（19+ を含む）では
  # 全スイートが失敗する。`18` と書くと 18 系の最新（18.20.x）が入って失敗するので、パッチまで固定する。
  # next（v2）は Phase 1c でテスト基盤を作り直したら Node 24 に戻す。
  # master（v1 系。2.0.0 のマージまで。1.x の修正も master から行う。D33）の release.yml は、v1 のテストのため 18.18.2 のまま（D29）。
  test:
    name: test (Node 18.18.2)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # package.json の packageManager の版を入れる。pnpm 12 は Node に依存しない実行ファイルなので、
      # setup-node より前に置いても、その後 Node 18.18.2 に切り替えても動く
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18.18.2
          # release ではキャッシュを使わない。setup-node v7.1.0 の自動キャッシュは packageManager が npm のときだけだが、
          # 対象が pnpm に広がっても有効にならないよう明示的に切る
          package-manager-cache: false

      # 依存とプロジェクト自身の lifecycle script（postinstall など）は実行しない（v1 は不要）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test
        run: pnpm test

  publish:
    name: publish to npm
    # test が失敗したら publish しない（タグと version の照合はこのジョブの先頭で、publish より前に行う）
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Trusted Publishing と provenance の OIDC トークン発行に必要
      id-token: write
    outputs:
      version: ${{ steps.dist-tag.outputs.version }}
      major: ${{ steps.dist-tag.outputs.major }}
      prerelease: ${{ steps.dist-tag.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # このジョブは push しないので、GITHUB_TOKEN を git の設定に残さない
          persist-credentials: false

      # package.json の packageManager の版を入れる（setup-node より前）
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # registry-url は付けない（.npmrc に `_authToken=${NODE_AUTH_TOKEN}` のプレースホルダーを作らない。
          # pnpm publish は OIDC で認証し、npm view も既定の registry.npmjs.org を見る）
          # publish するジョブではキャッシュを使わない（cache poisoning 対策）
          package-manager-cache: false

      # タグ名はイベント由来の値なので、run に直接埋め込まず env 経由で参照する（スクリプト注入防止）
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v${version}" ]]; then
            echo "::error::tag (${TAG}) does not match package.json version (v${version})"
            exit 1
          fi

      # id-token: write を持つジョブなので、依存とプロジェクト自身の lifecycle script（postinstall など）は実行しない
      # （lifecycle script 経由で OIDC トークンが使われる経路を塞ぐ。build では devDependency の tsc は動く。
      # v1 の build は tsc だけなので script は不要）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      # dist-tag の判定（spec 10.1）:
      #   A. major が npm の latest の major より古い → プレリリースも含めて publish せずに止める
      #      （2.0.0 以降 1.x は出さない。D31。プレリリースを素通りさせると next が古い major に戻る。
      #      `--tag v<major>` は semver 範囲になるタグ名として npm が拒否する）
      #   B. version に `-` を含む（プレリリース）→ --tag next
      #   C. それ以外 → 指定なし（latest）
      # latest が取れないときは E404（未公開）だけ「比較対象なし」として続け、それ以外は止める
      # （誤って latest や next を上書きするより止まる方が安全）。
      - name: Determine dist-tag
        id: dist-tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # 前のステップで tag == "v<package.json の version>" を確認済み
          version="${TAG#v}"
          major="${version%%.*}"
          dist_tag=""
          prerelease=false

          # E404 は stdout ではなく stderr にしか出ないので、stderr を取って判定する
          err_file="$(mktemp)"
          if latest="$(npm view react-native-store-version dist-tags.latest 2>"$err_file")"; then
            # 成功しても値が想定外なら、latest を上書きしないよう止める
            if [[ ! "$latest" =~ ^[0-9]+\. ]]; then
              echo "::error::unexpected dist-tags.latest: '${latest}'"
              exit 1
            fi
            latest_major="${latest%%.*}"
            if (( major < latest_major )); then
              echo "::error::${version} is older than the major of dist-tags.latest (${latest}); older majors are no longer published"
              exit 1
            fi
          elif grep -q 'E404' "$err_file"; then
            echo "react-native-store-version is not published yet"
          else
            cat "$err_file" >&2
            echo "::error::npm view failed (not E404)"
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            dist_tag="next"
            prerelease=true
          fi

          echo "version=${version} major=${major} dist-tag=${dist_tag:-(latest)} prerelease=${prerelease}"
          {
            echo "version=${version}"
            echo "major=${major}"
            echo "dist-tag=${dist_tag}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      # NODE_AUTH_TOKEN / NPM_TOKEN は使わない（OIDC で認証する）。
      # pnpm（11 以降）の publish は npm CLI に任せず、OIDC の trusted publishing と provenance を自前で扱うので、
      # npm CLI の版（trusted publishing に必要な npm >= 11.5.1）は確認しない。
      # --no-git-checks: タグ push の checkout は detached HEAD なので、pnpm の git のチェック（ブランチ・clean・remote との差）を外す
      - name: Publish
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.dist-tag }}
        run: |
          if [[ -n "$DIST_TAG" ]]; then
            pnpm publish --provenance --no-git-checks --tag "$DIST_TAG"
          else
            pnpm publish --provenance --no-git-checks
          fi

  github-release:
    name: create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

  major-tag:
    name: move major tag
    needs: publish
    # プレリリースでは major タグを動かさない
    if: needs.publish.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # タグを push するので、このジョブだけは credentials を残す
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # publish した版自身の major（1.x なら v1、2.x なら v2）を付け替える。
      # v1 などはトリガーのパターンに合わないので、push してもこのワークフローは再発火しない。
      # その major で公開済みの正式版のうち、この版が最新のときだけ付け替える
      # （古い版のジョブを再実行しても v<major> が古い版に戻らないように）。
      # publish 直後は npm view にまだ出てこないことがあるので、この版自身も候補に加えて比べる。
      - name: Move major tag
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          MAJOR: ${{ needs.publish.outputs.major }}
        run: |
          # 範囲に合う版が 1 つも無い（その major の最初の正式版で、まだ npm view に出てこない）と
          # npm view は E404 で失敗する。E404 のときだけ「公開済みの正式版なし」として扱い、それ以外は止める
          err_file="$(mktemp)"
          if ! published="$(npm view "react-native-store-version@^${MAJOR}.0.0" version --json 2>"$err_file")"; then
            if grep -q 'E404' "$err_file"; then
              published=""
            else
              cat "$err_file" >&2
              echo "::error::npm view failed (not E404)"
              exit 1
            fi
          fi
          # コマンド置換の中では errexit が外れるので、node の失敗で止まるよう独立した代入にする
          list="$(printf '%s' "$published" | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const v = s.trim() ? JSON.parse(s) : [];
              for (const x of Array.isArray(v) ? v : [v]) console.log(x);
            });
          ')"
          highest="$(printf '%s\n' "$list" "$VERSION" | sed '/^$/d' | sort -V | tail -n 1)"
          if [[ "$highest" != "$VERSION" ]]; then
            echo "v${MAJOR} is kept: ${VERSION} is older than the published ${highest}"
            exit 0
          fi
          git tag -f "v${MAJOR}"
          git push -f origin "v${MAJOR}"
