name: PR for master
on:
  pull_request:
    # ready_for_review: draft の PR（next → master）を ready にしたときも走らせる（D33）
    types: ['opened', 'synchronize', 'ready_for_review']
    branches:
      # 2.0.0 のマージまでは master が v1 系で、1.x の修正も master に向けて出す（D33）
      - 'master'

# PR の CI には secrets も書き込み権限も渡さない
permissions:
  contents: read

jobs:
  build_and_deploy:
    name: build test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # package.json の packageManager の版を入れる。setup-node の cache: pnpm が pnpm を使うので setup-node より前に置く。
      # pnpm 12 は Node に依存しない実行ファイルなので、後で setup-node が Node を切り替えても動く
      # package.json の packageManager は、pnpm/action-setup に同梱された bootstrap の版（v6.1.1 では 12.17.0。
      # src/install-pnpm/bootstrap/native-lock.json）と揃える。ずれると action が lockfile の外で pnpm を self-update する。
      # どちらかを上げるときはもう一方も揃え、`pnpm install` で pnpm-lock.yaml の packageManagerDependencies を更新する（D34）
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # v1 のテストは Node 18.18.2 で実行する。v1 の devDependency react-native@0.69.3 の jest/setup.js が
      # global.performance に代入するため、Node 18.19.0 以降（19+ を含む）では全スイートが失敗する（D29）。
      # next（v2）は Phase 1c でテスト基盤を作り直したら Node 24 に戻す
      - name: Setup Node.js (test)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18.18.2
          cache: pnpm

      # 依存の install script は pnpm-workspace.yaml の allowBuilds で許可したものしか実行されない
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # lint / typecheck / build は release.yml と同じ Node 24 で確認する（キャッシュは上の setup-node で扱うので、ここでは使わない）
      - name: Setup Node.js (build)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
