name: PR for master
on:
  pull_request:
    # ready_for_review: draft の PR（next → master）を ready にしたときも走らせる（D33）
    types: ['opened', 'synchronize', 'ready_for_review']
    branches:
      # 2.0.0 のマージまでは master が v1 系で、1.x の修正も master に向けて出す（D33）
      - 'master'

# PR の CI には secrets も書き込み権限も渡さない
permissions:
  contents: read

jobs:
  # テストは Node 22 / 24 / 26 のマトリクス。lint / typecheck / build は release.yml と同じ Node 24 の別ジョブで確認する
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # package.json の packageManager の版を入れる。setup-node の cache: pnpm が pnpm を使うので setup-node より前に置く。
      # pnpm 12 は Node に依存しない実行ファイルなので、後で setup-node が Node を切り替えても動く
      # package.json の packageManager は、pnpm/action-setup に同梱された bootstrap の版（v6.1.1 では 12.17.0。
      # src/install-pnpm/bootstrap/native-lock.json）と揃える。ずれると action が lockfile の外で pnpm を self-update する。
      # どちらかを上げるときはもう一方も揃え、`pnpm install` で pnpm-lock.yaml の packageManagerDependencies を更新する（D34）
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # 依存の install script は pnpm-workspace.yaml の allowBuilds で許可したものしか実行されない。
      # テストはライブラリ本体だけなので、workspace の example（Expo）の依存は入れない（D54）
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --filter react-native-store-version

      - name: Test
        run: pnpm test --coverage

  build:
    name: build (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # test ジョブと同じ理由・同じ版の対応（package.json の packageManager と揃える。D34）
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          # test ジョブ（ライブラリ本体だけを入れる）とキャッシュのキーを分ける。同じキーだと、先に保存した方の
          # 中身（example の依存の有無）をもう一方が毎回戻すことになる
          cache-dependency-path: |
            pnpm-lock.yaml
            example/package.json

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # dist を辿るテスト（アプリの入口から dist/cli に届かない・dist の .d.ts に Node の型が無い）。dist が無いと skip になり、
      # test ジョブは build しないので、ここで build の後に走らせる（D57 ⑩）。
      # dist が消えた・ケースが消えたなどで skip のまま緑にならないよう、Jest の結果の JSON から、名前が `dist:` で始まるケースが
      # 決めた数だけあり、すべて passed かを確かめる（同じファイルの src のケースは dist が無くても通るので、全体の件数では見ない）。
      # __tests__/index.exports.test.ts の `dist:` のケースを足したり減らしたりしたら、expected も合わせる
      - name: Test dist
        shell: bash
        run: |
          result="${RUNNER_TEMP}/index.exports.json"
          pnpm jest --ci --json --outputFile="$result" __tests__/index.exports.test.ts
          node -e '
            const expected = 2;
            const cases = require(process.argv[1])
              .testResults.flatMap((file) => file.assertionResults)
              .filter((test) => test.title.startsWith("dist:"));
            for (const test of cases) {
              console.log(`${test.status}: ${test.title}`);
            }
            if (cases.length !== expected || cases.some((test) => test.status !== "passed")) {
              console.log(`::error::expected ${expected} passed dist: tests, got ${cases.filter((test) => test.status === "passed").length} of ${cases.length} (is dist built?)`);
              process.exit(1);
            }
          ' "$result"

      # bin（dist/cli/index.js）を npm / pnpm の shim から動かすには先頭に shebang が要る（tsc が src/cli/index.ts から残す）
      - name: Check CLI shebang
        shell: bash
        run: |
          f=dist/cli/index.js
          if [[ "$(head -n 1 "$f")" != '#!/usr/bin/env node' ]]; then
            echo "::error::$f does not start with #!/usr/bin/env node"
            exit 1
          fi

      # example（Expo SDK 58 / TypeScript 6）の型チェック。ライブラリの dist の型定義を、利用者と同じ形で読むので Build の後に置く
      - name: Typecheck example
        run: pnpm --filter react-native-store-version-example typecheck

      # 配布物にテストと fixture が入っていないこと（files の設定ミスの検出）
      - name: Check package contents
        # shell: bash は -eo pipefail で動く（未指定の既定は -e のみ）。pack の出力を変数に取るので、pack が失敗すれば
        # ここで止まる（パイプで grep に流すと pack の失敗が見えず、何も出ないまま通ってしまう）
        shell: bash
        run: |
          out="$(pnpm pack --dry-run 2>&1)" || { printf '%s\n' "$out"; echo "::error::pnpm pack failed"; exit 1; }
          if grep -E '__tests__|__fixtures__|__helpers__' <<<"$out"; then
            echo "::error::the package contains test files"
            exit 1
          fi
          # `react-native-store-version/texts/ja` の入口（package.json の exports と、exports を見ない古い Metro 用のパッケージ直下の
          # texts/ja.js / ja.d.ts。D50 ⑤）が入っていること
          # CLI（package.json の bin）も入っていること（4c）
          for f in texts/ja.js texts/ja.d.ts dist/texts/ja.js dist/texts/ja.d.ts dist/cli/index.js; do
            if ! grep -qxF -- "$f" <<<"$out"; then
              echo "::error::the package is missing ${f}"
              exit 1
            fi
          done
          # composite action（action.yml）と workflow は GitHub のリポジトリから使うもので、npm の配布物には要らない
          if grep -E '^(action\.ya?ml|\.github/)' <<<"$out"; then
            echo "::error::the package contains action.yml or .github/"
            exit 1
          fi

      # 配布物の大きさ（PR に記載する。phase-4 の 4c）。pnpm pack --dry-run は大きさを出さないので、
      # RUNNER_TEMP に実際に pack して、tarball と展開後（中のファイルの合計）の大きさを Job Summary に書く
      - name: Report package size
        shell: bash
        run: |
          dir="$(mktemp -d "${RUNNER_TEMP}/pack.XXXXXX")"
          pnpm pack --pack-destination "$dir" >/dev/null
          tarballs=("$dir"/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 || ! -f "${tarballs[0]}" ]]; then
            echo "::error::pnpm pack did not create one tarball"
            exit 1
          fi
          tgz="${tarballs[0]}"
          name="$(basename "$tgz")"
          packed="$(wc -c <"$tgz" | tr -d ' ')"
          unpacked="$(tar -xOzf "$tgz" | wc -c | tr -d ' ')"
          files="$(tar -tzf "$tgz" | grep -cv '/$')"
          echo "${name}: packed ${packed} B, unpacked ${unpacked} B, ${files} files"
          {
            echo '### pnpm pack'
            echo ''
            echo '| Tarball | Packed | Unpacked | Files |'
            echo '| --- | --- | --- | --- |'
            echo "| ${name} | ${packed} B | ${unpacked} B | ${files} |"
          } >>"$GITHUB_STEP_SUMMARY"

      # 取り込んだ compare-versions の著作権表示と MIT ライセンス全文（MIT の条件）がビルド成果物に残っていること
      # （ファイルの移動や、先頭のコメントの形が `/*!` 以外に変わると消える）
      - name: Check vendor license notice
        shell: bash
        run: |
          f=dist/vendor/compare-versions.js
          if ! head -n 1 "$f" | grep -q '^/\*!'; then
            echo "::error::$f lost the leading /*! license notice"
            exit 1
          fi
          for needle in 'Copyright (c) 2015-2021 Ole Michelsen' 'The above copyright notice and this permission notice shall be included'; do
            if ! grep -qF "$needle" "$f"; then
              echo "::error::$f lost the license text: $needle"
              exit 1
            fi
          done
