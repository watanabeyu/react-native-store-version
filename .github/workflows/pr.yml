name: PR for master
on:
  pull_request:
    # ready_for_review: draft の PR（next → master）を ready にしたときも走らせる（D33）
    types: ['opened', 'synchronize', 'ready_for_review']
    branches:
      # 2.0.0 のマージまでは master が v1 系で、1.x の修正も master に向けて出す（D33）
      - 'master'

# PR の CI には secrets も書き込み権限も渡さない
permissions:
  contents: read

jobs:
  # テストは Node 22 / 24 / 26 のマトリクス。lint / typecheck / build は release.yml と同じ Node 24 の別ジョブで確認する
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # package.json の packageManager の版を入れる。setup-node の cache: pnpm が pnpm を使うので setup-node より前に置く。
      # pnpm 12 は Node に依存しない実行ファイルなので、後で setup-node が Node を切り替えても動く
      # package.json の packageManager は、pnpm/action-setup に同梱された bootstrap の版（v6.1.1 では 12.17.0。
      # src/install-pnpm/bootstrap/native-lock.json）と揃える。ずれると action が lockfile の外で pnpm を self-update する。
      # どちらかを上げるときはもう一方も揃え、`pnpm install` で pnpm-lock.yaml の packageManagerDependencies を更新する（D34）
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # 依存の install script は pnpm-workspace.yaml の allowBuilds で許可したものしか実行されない
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test --coverage

  build:
    name: build (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # test ジョブと同じ理由・同じ版の対応（package.json の packageManager と揃える。D34）
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # 配布物にテストと fixture が入っていないこと（files の設定ミスの検出）
      - name: Check package contents
        # shell: bash は -eo pipefail で動く（未指定の既定は -e のみ）。pack の出力を変数に取るので、pack が失敗すれば
        # ここで止まる（パイプで grep に流すと pack の失敗が見えず、何も出ないまま通ってしまう）
        shell: bash
        run: |
          out="$(pnpm pack --dry-run 2>&1)" || { printf '%s\n' "$out"; echo "::error::pnpm pack failed"; exit 1; }
          if grep -E '__tests__|__fixtures__|__helpers__' <<<"$out"; then
            echo "::error::the package contains test files"
            exit 1
          fi

      # 取り込んだ compare-versions の著作権表示と MIT ライセンス全文（MIT の条件）がビルド成果物に残っていること
      # （ファイルの移動や、先頭のコメントの形が `/*!` 以外に変わると消える）
      - name: Check vendor license notice
        shell: bash
        run: |
          f=dist/vendor/compare-versions.js
          if ! head -n 1 "$f" | grep -q '^/\*!'; then
            echo "::error::$f lost the leading /*! license notice"
            exit 1
          fi
          for needle in 'Copyright (c) 2015-2021 Ole Michelsen' 'The above copyright notice and this permission notice shall be included'; do
            if ! grep -qF "$needle" "$f"; then
              echo "::error::$f lost the license text: $needle"
              exit 1
            fi
          done
