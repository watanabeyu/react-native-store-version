# 実ストア（App Store の iTunes Lookup と Google Play の詳細ページ）から、既知のアプリの版をライブラリの取得処理で
# 取れるかを毎日確かめる（ストアの応答の形が変わったことに早く気づくため）。失敗したら Issue を作る
# （同じタイトルの Issue が開いていればコメントで追記する）。
#
# - schedule は既定ブランチ（master）の workflow しか動かない。workflow_dispatch も既定ブランチのファイルから実行する
# - 公開リポジトリの schedule は、リポジトリに 60 日間活動が無いと GitHub が自動で止める。止まったら
#   Actions の画面でこの workflow を開き、「Enable workflow」で有効にし直す
# - 手元で試すときは、下の CANARY_APPS をコピーして渡す（実ストアに出るので続けて何度も実行しない）:
#   pnpm build && CANARY_APPS="$(printf 'ios com.github.stormbreaker.prod jp\nandroid com.github.android')" \
#     node .github/scripts/canary.mjs /tmp/canary-body.md
name: canary

on:
  schedule:
    # 1 日 1 回（UTC 20:37 = 日本時間 5:37）。毎時 0 分は GitHub の schedule が混んで遅れやすいので避ける
    - cron: '37 20 * * *'
  workflow_dispatch:

# ジョブ単位で必要な権限だけを付与する
permissions: {}

# 1 本ずつ実行する（schedule と手動実行が重なったとき、両方が「開いている Issue なし」と見て 2 つ作らないように）
concurrency:
  group: canary
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  canary:
    name: canary (real stores)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # 失敗したときの Issue の作成とコメント
      issues: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pr.yml の test ジョブと同じ理由・同じ版の対応（package.json の packageManager と揃える）
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # issues: write を持つジョブなので、キャッシュは使わない（release.yml と同じく、毎回 lockfile から入れる）
          package-manager-cache: false

      # 取得処理（dist/fetchers）を作るのに要るのはライブラリ本体だけなので、workspace の example の依存は入れない
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --filter react-native-store-version

      - name: Build
        run: pnpm build

      # 失敗しても次のステップ（Issue）に進むよう continue-on-error にし、job は最後のステップで失敗にする。
      # GH_TOKEN はこのステップに渡さない（ストアから取った文字列を扱うステップに書き込みの権限を持たせない）
      - name: Get versions from the stores
        id: canary
        continue-on-error: true
        env:
          # 1 行に 1 アプリ。`ios <bundleId> <country>` か `android <package 名>`。
          # 版が数字とドットで表示される、長く公開されているアプリだけを入れる
          # （Play で版の欄が空のアプリや、数字でない版を出すアプリは、取得できても失敗になるので入れない）
          CANARY_APPS: |
            ios com.github.stormbreaker.prod jp
            android com.github.android
        run: node .github/scripts/canary.mjs "$RUNNER_TEMP/canary-body.md"

      # 本文はスクリプトが書いたファイルを --body-file で渡す（ストアから取った文字列を run: に埋め込まない）。
      # 同じタイトルの開いている Issue があれば（複数あれば一覧の先頭に）コメントし、無ければ作る
      - name: Report the failure in an issue
        if: steps.canary.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Canary failed to get app versions from the stores'
        run: |
          body="$RUNNER_TEMP/canary-body.md"
          # スクリプトが本文を書く前に落ちた（dist が読めないなど）ときも Issue を作る
          if [[ ! -s "$body" ]]; then
            {
              echo 'The canary script failed before writing a report.'
              echo ''
              echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } >"$body"
          fi
          # --search は語の一致なので、タイトルが完全に同じものだけを選ぶ
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" \
            --json number,title --jq '[.[] | select(.title == env.TITLE)] | first | .number // empty')"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$body"
          fi

      - name: Fail the job
        if: steps.canary.outcome == 'failure'
        run: |
          echo '::error::could not get the app versions from the stores (see the job summary and the issue)'
          exit 1
