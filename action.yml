# composite action（spec 9.2）。アプリの CI で依存のインストールの後に `uses:` 1 行で設定をチェックする。
# ロジックは npm パッケージの CLI（`react-native-store-version check`）にあり、ここではアプリにインストール済みの CLI を探して呼ぶだけ。
# 呼び出し元のジョブの中で動くので、secrets / GITHUB_TOKEN は受け取らない（spec 10.2）。
# Node は呼び出し元が用意する（CLI が版を確かめる）。
# このファイルは npm の配布物に入れない（package.json の files に無い。pr.yml の Check package contents で確かめる）
name: 'react-native-store-version check'
description: 'Checks the setup of react-native-store-version in a React Native / Expo app with the check CLI of the installed package'
author: 'watanabeyu'

inputs:
  working-directory:
    description: 'The app directory (where react-native-store-version is installed). For a monorepo, e.g. apps/mobile'
    required: false
    default: '.'
  strict:
    description: 'true to fail on warnings too'
    required: false
    default: 'false'
  ignore:
    description: 'Comma-separated checks not to run (e.g. C8)'
    required: false
    default: ''
  country:
    description: 'The App Store country for C3 (2 letters)'
    required: false
    default: 'us'

runs:
  using: 'composite'
  steps:
    - name: Run react-native-store-version check
      shell: bash
      # inputs は利用者の値なので、run に直接埋め込まず env 経由でシェル変数として参照する（スクリプト注入防止。spec 10.2）。
      # 名前は呼び出し元のジョブの env とぶつからないよう RNSV_ を付ける
      env:
        RNSV_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        RNSV_STRICT: ${{ inputs.strict }}
        RNSV_IGNORE: ${{ inputs.ignore }}
        RNSV_COUNTRY: ${{ inputs.country }}
      run: |
        # 注釈の message のエスケープ（CLI の escapeData と同じ。後の置き換えで入る `%` を二重にしないよう `%` を最初に置き換える）。
        # working-directory などの利用者の値の改行の後ろが、ワークフローコマンドとして解釈されないようにする
        escape_data() {
          local s="$1"
          s="${s//'%'/%25}"
          s="${s//$'\r'/%0D}"
          s="${s//$'\n'/%0A}"
          printf '%s' "$s"
        }
        # CLI の注釈と同じ title（D57 ④）。CLI を呼ぶ前の失敗なので、ここで error の注釈を出して終了コード 1 にする
        fail() {
          printf '::error title=%s::%s\n' "$1" "$(escape_data "$2")"
          exit 1
        }
        fail_input() { fail 'react-native-store-version check' "$1"; }
        fail_c1() { fail 'react-native-store-version check C1' "$1"; }

        # 空の値（未設定の vars を渡したときなど）は既定と同じに扱う
        working_directory="${RNSV_WORKING_DIRECTORY:-.}"

        # 引数は配列で組み立てる（文字列の連結にすると、値の空白や引用符で引数が分かれる）
        args=()
        case "$RNSV_STRICT" in
          [Tt][Rr][Uu][Ee]) args+=(--strict) ;;
          [Ff][Aa][Ll][Ss][Ee] | '') ;;
          # 打ち間違い（yes など）を黙って false にすると、warning で落ちるつもりの CI が素通りするので止める
          *) fail_input "strict: \"${RNSV_STRICT}\" is not true or false" ;;
        esac
        if [[ -n "$RNSV_IGNORE" ]]; then
          args+=(--ignore "$RNSV_IGNORE")
        fi
        # 空なら --country を付けず CLI の既定（us）にする。値の形は CLI が確かめる
        if [[ -n "$RNSV_COUNTRY" ]]; then
          args+=(--country "$RNSV_COUNTRY")
        fi

        # node が無いと下の require.resolve の失敗が「未インストール」に見えてしまうので、先に分けて知らせる
        if ! command -v node >/dev/null 2>&1; then
          fail_input 'node is not found. Set up Node.js (e.g. actions/setup-node) before this action'
        fi

        # CDPATH が設定されていても working-directory 以外へ移らないようにする
        if ! CDPATH='' cd -- "$working_directory" 2>/dev/null; then
          fail_input "working-directory: ${working_directory} is not a directory"
        fi
        # CLI の --cwd と、C1 の文面に入れる絶対パス（node の process.cwd() と同じく、シンボリックリンクを解決したもの）
        app_dir="$(pwd -P)"

        # CLI の場所は、アプリのディレクトリから Node の解決で引く（D56 ⑦）。pnpm の isolated ではアプリの node_modules の
        # シンボリックリンクから、npm / yarn の workspaces の hoist では親の node_modules から見つかる
        # （アプリの node_modules/.bin が無いことがあるので bin は使わない）。
        # require.resolve は NODE_PATH とグローバルのフォルダも見るが、そこで見つけた CLI も --cwd から親へ辿って C1 を判定し、
        # error にする（D57 ①）
        if ! package_json="$(node -p "require.resolve('react-native-store-version/package.json')" 2>/dev/null)" || [[ -z "$package_json" ]]; then
          # CLI の C1 の error（src/cli/checks/installed.ts）と同じ文面
          fail_c1 "react-native-store-version is not installed (no node_modules/react-native-store-version/package.json in ${app_dir} or its parents)"
        fi
        package_dir="$(dirname -- "$package_json")"
        cli="${package_dir}/dist/cli/index.js"

        # v1 には CLI が無い。git からのインストールなど dist の無い入れ方でも同じ。CLI を呼べないので C1 の error にする
        if [[ ! -f "$cli" ]]; then
          version="$(RNSV_PACKAGE_JSON="$package_json" node -p 'String(require(process.env.RNSV_PACKAGE_JSON).version)' 2>/dev/null || echo unknown)"
          fail_c1 "react-native-store-version ${version} has no check CLI (no dist/cli/index.js in ${package_dir}). The check needs v2 or later (v1 and an install without dist have no CLI)"
        fi

        # 注釈にしない行なので、改行を空白にする（CLI の oneLine と同じ。値の改行の後ろがワークフローコマンドにならないように）
        line="react-native-store-version check: running ${cli} in ${app_dir}"
        printf '%s\n' "${line//[$'\r\n']/ }"
        node "$cli" check --cwd "$app_dir" "${args[@]}"
